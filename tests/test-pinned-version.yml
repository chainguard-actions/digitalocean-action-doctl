name: Test doctl install with pinned version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '1.109.0'
          no_auth: 'true'
      - name: Assert doctl is installed at correct version
        run: |
          echo "Checking doctl is available in PATH..."
          if ! command -v doctl &> /dev/null; then
            echo "FAIL: doctl not found in PATH"
            exit 1
          fi
          ACTUAL_VERSION=$(doctl version | head -1 | grep -oP '\d+\.\d+\.\d+' | head -1)
          echo "actual version: $ACTUAL_VERSION"
          if [ "$ACTUAL_VERSION" != "1.109.0" ]; then
            echo "FAIL: expected version 1.109.0, got $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: doctl version $ACTUAL_VERSION matches expected"
