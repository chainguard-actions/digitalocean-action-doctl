name: Test basic usage - install latest doctl
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          no_auth: 'true'
      - name: Assert doctl is installed
        run: |
          which doctl
          if [ $? -ne 0 ]; then
            echo "FAIL: doctl not found on PATH"
            exit 1
          fi
          echo "PASS: doctl is installed"
      - name: Assert doctl runs
        run: |
          doctl version
          if [ $? -ne 0 ]; then
            echo "FAIL: doctl version command failed"
            exit 1
          fi
          echo "PASS: doctl version ran successfully"
