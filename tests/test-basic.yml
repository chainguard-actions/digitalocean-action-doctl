name: Test basic usage - doctl install with token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          version: latest
        continue-on-error: true
      - name: Assert doctl is installed
        run: |
          if command -v doctl >/dev/null 2>&1; then
            echo "PASS: doctl is installed"
            doctl version
          else
            echo "FAIL: doctl was not installed"
            exit 1
          fi
