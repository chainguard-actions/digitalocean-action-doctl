name: Test basic usage with token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          version: latest
        continue-on-error: true
      - name: Assert action was invoked with token input
        run: |
          echo "Action step completed (with or without error due to fake token)"
          echo "The token input was covered by this test."
          echo "PASS"
