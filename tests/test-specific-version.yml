name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '1.101.0'
          token: fake-token-for-testing
        continue-on-error: true
      - name: Assert doctl is installed at the specified version
        run: |
          echo "Checking doctl is available..."
          if ! command -v doctl > /dev/null 2>&1; then
            echo "FAIL: doctl not found on PATH"
            exit 1
          fi
          echo "doctl found at: $(command -v doctl)"
          VERSION_OUTPUT=$(doctl version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "1.101.0"; then
            echo "PASS: correct version 1.101.0 installed"
          else
            echo "FAIL: expected version 1.101.0 in output, got: $VERSION_OUTPUT"
            exit 1
          fi
