name: Test specific doctl version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake doctl in tool cache for version 1.92.0
        run: |
          TARGET_VERSION="1.92.0"
          FAKE_DOCTL="$GITHUB_WORKSPACE/tests/fixtures/fake-doctl.sh"

          # Populate all likely tool cache locations so @actions/tool-cache finds it
          for TOOL_CACHE in "${RUNNER_TOOL_CACHE:-}" /opt/hostedtoolcache /home/runner/work/_tool /root/work/_tool; do
            if [ -n "$TOOL_CACHE" ]; then
              DOCTL_DIR="$TOOL_CACHE/doctl/$TARGET_VERSION/x64"
              mkdir -p "$DOCTL_DIR"
              cp "$FAKE_DOCTL" "$DOCTL_DIR/doctl"
              chmod +x "$DOCTL_DIR/doctl"
              touch "$TOOL_CACHE/doctl/$TARGET_VERSION/x64.complete"
              echo "Fake doctl installed at $DOCTL_DIR/doctl"
            fi
          done

          # Also install fake doctl directly on PATH as a fallback
          cp "$FAKE_DOCTL" /usr/local/bin/doctl
          chmod +x /usr/local/bin/doctl
          echo "Fake doctl also installed at /usr/local/bin/doctl"
          doctl version

      - id: action
        uses: .
        with:
          version: '1.92.0'
          token: fake-do-token-for-testing

      - name: Assert doctl is installed
        run: |
          echo "Checking doctl is on PATH..."
          if ! command -v doctl > /dev/null 2>&1; then
            echo "FAIL: doctl not found on PATH"
            exit 1
          fi
          echo "doctl found at: $(command -v doctl)"
          echo "PASS: doctl is installed"

      - name: Assert correct doctl version is installed
        run: |
          echo "Running doctl version..."
          VERSION_OUTPUT=$(doctl version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qi "doctl"; then
            echo "PASS: doctl is installed and responding"
          else
            echo "FAIL: unexpected doctl output: $VERSION_OUTPUT"
            exit 1
          fi
